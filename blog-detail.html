<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="site.css">
</head>

<body class="min-h-screen flex flex-col bg-slate-50 text-slate-900">
    <main class="flex-1">

                    <div class="mx-auto mb-3 h-8 w-8 animate-spin rounded-full border-4 border-blue-200 border-t-blue-700" aria-hidden="true"></div>
                    <p class="mb-0 font-semibold text-slate-500">Memuat artikel...</p>
                </div>
            </article>
        </div>
    </main>
        <footer class="mt-auto bg-lime-500 py-4 text-center font-semibold"><strong>IKRAABI 2025/2027</strong> · <a
            href="blog.html" class="text-slate-900 underline">Kembali ke Kabar IKRAABI</a></footer>
    <script src="blog-api.js"></script>
    <script src="site.js"></script>
</body>

</html>
